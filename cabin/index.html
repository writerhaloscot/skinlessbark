    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js",

    <script type="module">
        import * as THREE from 'three';
        import {
            OrbitControls
        } from 'three/addons/controls/OrbitControls.js';
        import {
            GLTFLoader
        } from 'three/addons/loaders/GLTFLoader.js';

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const min = new THREE.Vector3(-10, 1, -10); // Room Min
        const max = new THREE.Vector3(10, 1, 10); // Room Max
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer({
            alpha: false,
            powerPreference: "high-performance",
            antialias: true
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        /* controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1;
        controls.zoomSpeed = 1; */

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Mesh
        /* const geometry = new THREE.BoxGeometry(1, 1, 1);
        const skin = new THREE.MeshStandardMaterial({
            color: 0x000000
        });
        const cube = new THREE.Mesh(geometry, skin);
        scene.add(cube); */

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Room
        const frame = new THREE.BoxGeometry(20, 20, 20);
        const textureLoader = new THREE.TextureLoader();
        const wallTexture = textureLoader.load('../img/pixabay/pexels-rock-wall-1845128-min-min.jpg')
        const material = new THREE.MeshStandardMaterial({
            color: 0xB0B0B0,
            map: wallTexture,
            side: THREE.BackSide // Essential to see the inside
            // side: THREE.DoubleSide // Optional: visible from both sides
        });
        const room = new THREE.Mesh(frame, material);
        scene.add(room);

        // Light
        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(0, 3, 0);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040)); // Soft white light

        // camera.position.z = 0.1; // Stay inside the box

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            /* cube.rotation.x += 0.01;
            cube.rotation.y += 0.01; */
            controls.update();
            camera.position.clamp(min, max);
            renderer.render(scene, camera);
        }
        renderer.setAnimationLoop(animate);


        // Load GLB
        const loader = new GLTFLoader();
        var deer = load_model('models/pix-quaternius_cc0-stag-1373.glb', -1, -1, -1, 1);

        function load_model(m, x, y, z, s) {
            loader.load(m, (gltf) => {
                const model = gltf.scene;
                model.position.set(x, y, z);
                model.scale.set(s, s, s);
                scene.add(model);
            });
            console.log('loaded');
        }

        // Clickable Model
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                console.log('Clicked on:', intersects[0].object);
                intersects[0].object.material.color.set(0x00ff00);
            }
        });

    </script>
